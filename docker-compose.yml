services:
  db:
    image: postgres:17-alpine
    profiles:
      - infra
      - api
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ledger
    ports:
      - 5432:5432
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - valkey-data:/data
    profiles:
      - infra
      - api
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    stop_grace_period: 60s
    image: exchequer-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - api
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ledger?schema=public
      - VALKEY_URL=redis://valkey:6379
      - JWT_SECRET=change-me-for-local-development
      - BALANCE_MONITOR_ENCRYPTION_KEY=${BALANCE_MONITOR_ENCRYPTION_KEY:-}
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  worker:
    image: exchequer-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - api
    command: ["node", "dist/worker.mjs"]
    environment:
      - VALKEY_URL=redis://valkey:6379
      - BALANCE_MONITOR_ENCRYPTION_KEY=${BALANCE_MONITOR_ENCRYPTION_KEY:-}
    depends_on:
      valkey:
        condition: service_healthy
volumes:
  pg-data:
  valkey-data:
